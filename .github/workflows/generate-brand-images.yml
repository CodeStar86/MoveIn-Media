name: Generate brand images
on:
  push:
    branches: [main]
    paths:
      - 'public/social-logo.svg'
      - 'public/favicon.svg'
      - '.github/workflows/generate-brand-images.yml'
      - 'scripts/generate_brand_images.py'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg pillow
      - run: python scripts/generate_brand_images.py
      - name: Commit generated static branding files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/social-logo.png public/favicon-32x32.png public/apple-touch-icon.png public/android-chrome-192x192.png public/android-chrome-512x512.png public/favicon.ico
          if ! git diff --cached --quiet; then
            git commit -m "Generate PNG social preview and browser icons"
            git push
          fi
